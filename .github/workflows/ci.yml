name: CI

# Every gate on every push: tsc, oxlint, bun test, the site build and its
# no-network check, Playwright end to end, each compiled CLI binary (macOS
# and Linux, arm64 and x64) against the CLI tests, and osv-scanner. The site
# artifact built here is what Pages deploys.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Engine, site, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch-models.ts', 'src/ai/catalog.ts') }}
      - run: bun run fetch-models
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Build the site
        run: bun run build
      - name: Privacy gate (no external origin in the bundle)
        run: bun run check:network
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 7

  cli:
    name: Command line (${{ matrix.target }} binary)
    # Every binary the release ships runs the whole CLI suite on its own platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: macos-latest, target: macos-arm64 }
          - { runner: macos-15-intel, target: macos-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch-models.ts', 'src/ai/catalog.ts') }}
      - run: bun run fetch-models
      - run: bun scripts/cli-binaries.ts ${{ matrix.target }}
      - name: The CLI tests, run by the binary itself
        run: bun test src/cli
        env:
          PIXVAULT_BIN: dist-cli/pixvault-${{ matrix.target }}

  osv:
    name: Known vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=bun.lock
