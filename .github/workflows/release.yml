name: Release

# Conventional-Commit releases once CI is green on main.
#   release   semantic-release turns feat → minor, fix → patch, ! → major into
#             a tag and a GitHub release with notes. No commit is pushed back:
#             the version lives in the tag.
#   binaries  compiles the standalone CLI per OS from that tag, macOS ones on
#             macOS where they are re-signed, attests and attaches them.
#   checksums writes SHA256SUMS for the attached binaries.
# maxgfr/homebrew-tap picks the binaries up from the release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: semantic-release
        id: release
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/commit-analyzer@13.0.1
          -p @semantic-release/release-notes-generator@14.1.1
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/github@12.0.10
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-latest
            targets: macos-arm64 macos-x64
          - runner: ubuntu-latest
            targets: linux-x64 linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/cli-binaries.ts --version "$VERSION" ${{ matrix.targets }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-cli/pixvault-*
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" dist-cli/pixvault-* --clobber
      - run: (cd dist-cli && shasum -a 256 -- pixvault-*) > "sums-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.runner }}
          path: sums-${{ matrix.runner }}.txt

  checksums:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          merge-multiple: true
      - run: |
          cat sums-*.txt | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
